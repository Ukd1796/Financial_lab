[build]
builder = "nixpacks"

# Service 1: Daily signal generation — 3:35 PM IST = 10:05 UTC
[[services]]
name = "run-signals"

[services.deploy]
cronSchedule = "5 10 * * 1-5"
startCommand = "python run_signals.py"

# Service 2: Morning order placement — 9:15 AM IST = 3:45 UTC
[[services]]
name = "run-orders"

[services.deploy]
cronSchedule = "45 3 * * 1-5"
startCommand = "python run_orders.py"
